<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>aloui.me</title>
  <meta name="description" content="aloui.me - coming soon">
  <style>
    :root {
      --bg: #0f1115;
      --fg: #f2f2f2;
      --muted: #8b93a1;
      --accent: #5eead4;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #fafafa;
        --fg: #111418;
        --muted: #5b6472;
        --accent: #0d9488;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main { max-width: 560px; }
    h1 {
      font-size: clamp(2.5rem, 8vw, 4rem);
      margin: 0 0 12px;
      letter-spacing: -0.03em;
    }
    h1 span { color: var(--accent); }
    p { color: var(--muted); font-size: 1.1rem; line-height: 1.6; margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>aloui<span>.me</span></h1>
    <p>Site under construction. Something is coming soon.</p>
  </main>
</body>
</html>
